<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SkinDock – Test</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2310b981'/%3E%3Cstop offset='1' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Crect x='18' y='12' width='28' height='28' rx='3' fill='%23fff'/%3E%3Crect x='18' y='12' width='28' height='9' rx='3' fill='%230b0f14' opacity='.85'/%3E%3Crect x='24' y='27' width='6' height='6' fill='%230b0f14'/%3E%3Crect x='34' y='27' width='6' height='6' fill='%230b0f14'/%3E%3Crect x='12' y='46' width='40' height='6' rx='3' fill='%23fff'/%3E%3C/svg%3E" />
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: { colors: {
      brand: { 400:'#34d399', 500:'#10b981', 600:'#059669' },
      dock: { bg:'#0b0f14', surface:'#131a22', border:'#1f2933' }
    } } }
  };
  // Flash olmaması için temayı erken uygula
  (function(){
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.classList.add('dark');
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.1.0/bundles/skinview3d.bundle.js"></script>
<style>
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  canvas { image-rendering: pixelated; touch-action: pan-y; }
  .card { border:1px solid #e2e8f0; background:#fff; border-radius:1rem; }
  .dark .card { border-color:#1f2933; background:#131a22; }
  .btn { border:1px solid #cbd5e1; border-radius:.75rem; padding:.5rem 1rem; transition:.15s; }
  .btn:hover { background:#f1f5f9; }
  .dark .btn { border-color:#1f2933; }
  .dark .btn:hover { background:rgba(255,255,255,.05); }
  .btn.on { background:#10b981; border-color:#10b981; color:#fff; }
  .btn.on:hover { background:#059669; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-dock-bg dark:text-slate-100 min-h-screen">
<div class="mx-auto max-w-5xl p-4">

  <!-- Navbar -->
  <header class="flex items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>
        <rect width="64" height="64" rx="16" fill="url(#lg)"/>
        <rect x="18" y="12" width="28" height="28" rx="3" fill="#fff"/>
        <rect x="18" y="12" width="28" height="9" rx="3" fill="#0b0f14" opacity=".85"/>
        <rect x="24" y="27" width="6" height="6" fill="#0b0f14"/>
        <rect x="34" y="27" width="6" height="6" fill="#0b0f14"/>
        <rect x="12" y="46" width="40" height="6" rx="3" fill="#fff" opacity=".95"/>
        <rect x="20" y="42" width="24" height="4" fill="#fff" opacity=".5"/>
      </svg>
      <span class="text-lg font-bold tracking-tight">Skin<span class="text-brand-500">Dock</span></span>
    </div>
    <div class="flex gap-2">
      <button id="themeBtn" class="btn" title="Tema">🌓</button>
      <button id="langBtn" class="btn">EN</button>
    </div>
  </header>

  <main class="mt-6 grid gap-4 md:grid-cols-2">
    <!-- 3D sahne -->
    <div class="card flex flex-col items-center p-4">
      <canvas id="skinCanvas"></canvas>
      <p id="status" class="mt-2 min-h-[1.25rem] text-sm text-slate-500 dark:text-slate-400"></p>
    </div>

    <!-- Kontroller -->
    <div class="card space-y-4 p-4">
      <div>
        <label class="mb-1 block text-sm font-medium" data-i18n="searchLabel"></label>
        <div class="flex gap-2">
          <input id="nick" value="Notch" autocomplete="off"
            class="w-full rounded-xl border border-slate-300 bg-transparent px-3 py-2 dark:border-dock-border" />
          <button id="goBtn" class="btn on" data-i18n="search"></button>
        </div>
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium" data-i18n="upload"></label>
        <input id="file" type="file" accept="image/png"
          class="block w-full text-sm file:mr-3 file:rounded-xl file:border-0 file:bg-brand-500 file:px-4 file:py-2 file:text-white" />
      </div>

      <div>
        <span class="mb-1 block text-sm font-medium" data-i18n="arms"></span>
        <div class="flex gap-2">
          <button id="mDefault" class="btn on" data-i18n="classic"></button>
          <button id="mSlim" class="btn" data-i18n="slim"></button>
        </div>
      </div>

      <div>
        <span class="mb-1 block text-sm font-medium" data-i18n="anim"></span>
        <div class="flex flex-wrap gap-2" id="animBtns">
          <button class="btn on" data-anim="walk" data-i18n="walk"></button>
          <button class="btn" data-anim="run" data-i18n="run"></button>
          <button class="btn" data-anim="idle" data-i18n="idle"></button>
          <button class="btn" data-anim="none" data-i18n="none"></button>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <input id="rot" type="checkbox" checked />
        <label for="rot" class="text-sm" data-i18n="rotate"></label>
      </div>

      <div class="flex gap-2 pt-1">
        <a id="dlBtn" class="btn" target="_blank" rel="noopener" data-i18n="download"></a>
      </div>
    </div>
  </main>
</div>

<script>
/* ---------- i18n ---------- */
const I18N = {
  tr: {
    searchLabel: 'Ely.by kullanıcı adı', search: 'Ara', upload: 'veya bilgisayardan .png skin yükle',
    arms: 'Kol tipi', classic: 'Klasik (Steve)', slim: 'İnce (Alex)',
    anim: 'Animasyon', walk: 'Yürü', run: 'Koş', idle: 'Bekle', none: 'Yok',
    rotate: 'Otomatik döndür', download: 'Skini indir',
    loading: 'Yükleniyor…', ok: 'Yüklendi: ',
    fail: 'Skin sunucusuna ulaşılamadı (CORS/ağ). Bilgisayardan .png yüklemeyi dene.',
    notfound: 'Bu kullanıcı adına ait Ely.by skini bulunamadı. Gerçek bir Ely.by kullanıcı adı dene.'
  },
  en: {
    searchLabel: 'Ely.by username', search: 'Search', upload: 'or upload a .png skin from your computer',
    arms: 'Arm type', classic: 'Classic (Steve)', slim: 'Slim (Alex)',
    anim: 'Animation', walk: 'Walk', run: 'Run', idle: 'Idle', none: 'None',
    rotate: 'Auto rotate', download: 'Download skin',
    loading: 'Loading…', ok: 'Loaded: ',
    fail: 'Could not reach the skin server (CORS/network). Try uploading a .png instead.',
    notfound: 'No Ely.by skin found for this username. Try a real Ely.by username.'
  }
};
let lang = localStorage.getItem('lang') || (navigator.language.startsWith('tr') ? 'tr' : 'en');
const T = (k) => I18N[lang][k];
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.dataset.i18n));
  document.getElementById('langBtn').textContent = lang === 'tr' ? 'EN' : 'TR';
}

/* ---------- 3D sahne ---------- */
const canvas = document.getElementById('skinCanvas');
const statusEl = document.getElementById('status');
const viewer = new skinview3d.SkinViewer({ canvas, width: 280, height: 380, zoom: 0.8, fov: 50 });
viewer.controls.enableZoom = false;
viewer.controls.enablePan = false;
viewer.autoRotate = true;
viewer.animation = new skinview3d.WalkingAnimation();

let model = 'default';
let currentSrc = null;

function resize() {
  const w = Math.min(320, window.innerWidth - 80);
  viewer.setSize(w, Math.round(w * 1.35));
}
window.addEventListener('resize', resize); resize();

async function loadSkin(src, label) {
  currentSrc = src;
  statusEl.textContent = T('loading');
  try {
    await viewer.loadSkin(src, { model });
    statusEl.textContent = T('ok') + label;
  } catch (e) {
    console.error(e);
    statusEl.textContent = T('fail');
  }
}

const skinUrl = (nick) => 'https://skinsystem.ely.by/skins/' + encodeURIComponent(nick) + '.png';

async function search() {
  const nick = document.getElementById('nick').value.trim();
  if (!nick) return;
  document.getElementById('dlBtn').href = skinUrl(nick);
  statusEl.textContent = T('loading');
  // 1) doğrudan, 2) ve 3) CORS başlığı ekleyen genel proxyler
  const urls = [
    'http://skinsystem.ely.by/skins/' + encodeURIComponent(nick) + '.png', // resmi dokümanda http geçiyor
    skinUrl(nick),
    'https://images.weserv.nl/?output=png&url=' + encodeURIComponent('skinsystem.ely.by/skins/' + nick + '.png'),
    'https://corsproxy.io/?url=' + encodeURIComponent('http://skinsystem.ely.by/skins/' + nick + '.png')
  ];
  let notFound = false; const errs = [];
  for (const u of urls) {
    try {
      const r = await fetch(u);
      if (r.status === 404) { notFound = true; break; }
      if (!r.ok) continue;
      const blob = await r.blob();
      return loadSkin(URL.createObjectURL(blob), nick);
    } catch (e) { console.warn('Denenen kaynak başarısız:', u, e); errs.push(u); }
  }
  statusEl.textContent = notFound ? T('notfound') : T('fail') + ' [' + errs.length + '/' + urls.length + ']';
}

/* ---------- Olaylar ---------- */
document.getElementById('goBtn').onclick = search;
document.getElementById('nick').addEventListener('keydown', e => e.key === 'Enter' && search());

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  loadSkin(URL.createObjectURL(f), f.name);
});

function setModel(m) {
  model = m;
  document.getElementById('mDefault').classList.toggle('on', m === 'default');
  document.getElementById('mSlim').classList.toggle('on', m === 'slim');
  if (currentSrc) viewer.loadSkin(currentSrc, { model }).catch(console.error);
}
document.getElementById('mDefault').onclick = () => setModel('default');
document.getElementById('mSlim').onclick = () => setModel('slim');

const ANIMS = {
  walk: () => new skinview3d.WalkingAnimation(),
  run:  () => new skinview3d.RunningAnimation(),
  idle: () => new skinview3d.IdleAnimation(),
  none: () => null
};
document.getElementById('animBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-anim]');
  if (!b) return;
  document.querySelectorAll('#animBtns .btn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  viewer.animation = ANIMS[b.dataset.anim]();
});

document.getElementById('rot').onchange = e => viewer.autoRotate = e.target.checked;

document.getElementById('themeBtn').onclick = () => {
  const dark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', dark ? 'dark' : 'light');
};
document.getElementById('langBtn').onclick = () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  localStorage.setItem('lang', lang);
  applyLang();
};

applyLang();
search();
</script>
</body>
</html>
