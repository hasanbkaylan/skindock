function renderFav(){const f=favs();$('#g2').replaceChildren(...f.map((n,i)=>mk(n,tagOf(n)||'★',i)));$('#nofav').hidden=!!f.length}
function single(sel,cb){const cs=$$(sel+' md-filter-chip');cs.forEach(c=>c.addEventListener('click',()=>requestAnimationFrame(()=>{cs.forEach(x=>x.selected=x===c);cb(c)})))}
single('#tg',()=>fillHome());
/* ---- Arama: kayıtlı isimlerde eşleşme + yazılan ismi doğrudan sorgulama ---- */
let view='home',st;
function show_(v){$$('main>section').forEach(s=>s.hidden=s.id!='v-'+v)}
function search(){const v=$('#q').value.trim();if(!v){show_(view);return}
const names=[...new Set([...FEAT.map(f=>f[0]),...favs(),...recent()])],lv=v.toLowerCase(),m=names.filter(n=>n.toLowerCase().includes(lv)||(tagOf(n)||'').includes(lv));
const items=[...m];if(!m.some(n=>n.toLowerCase()==lv)&&/^[\w.\- ]{2,32}$/.test(v))items.unshift(v);
$('#gr').replaceChildren(...(items.length?items.map((n,i)=>mk(n,tagOf(n)||(n==v?t('exact'):''),i)):[Object.assign(document.createElement('p'),{className:'empty',textContent:t('noskin')})]));show_('res')}
$('#q').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(search,350)});
$('#q').addEventListener('keydown',e=>{if(e.key=='Enter'){clearTimeout(st);search()}});
/* ---- 3D detay ---- */
let V,cur={n:'',u:'',m:'default'};const AN={walk:()=>new skinview3d.WalkingAnimation,run:()=>new skinview3d.RunningAnimation,idle:()=>new skinview3d.IdleAnimation,none:()=>null};
function fit(){if(!V)return;const w=Math.round(Math.max(120,Math.min(260,innerWidth-130,(innerHeight-430)/1.3)));V.setSize(w,Math.round(w*1.3))}
addEventListener('resize',fit);
function viewer(){if(V)return;V=new skinview3d.SkinViewer({canvas:$('#cv'),width:200,height:260,zoom:.8,fov:50});V.controls.enableZoom=false;V.controls.enablePan=false;V.autoRotate=true;V.animation=AN.walk()}
async function show(n,url){if(!url){const r=[n,...recent().filter(x=>x!=n)].slice(0,8);localStorage.recent=JSON.stringify(r)}
cur.n=n;$('#dn').textContent=n;$('#dlg').show();viewer();fit();$('#fv').selected=favs().includes(n);
const ld=loader(64);$('#st').append(ld);
try{url??=await skin(n);cur.u=url;await V.loadSkin(url,{model:cur.m})}catch(e){ld.remove();toast(e===404?t('nf'):t('fail'));$('#dlg').close();return}ld.remove()}
$('#x').onclick=()=>$('#dlg').close();
$('#seg').addEventListener('segmented-button-set-selection',e=>{cur.m=e.detail.button.dataset.m;if(cur.u)V.loadSkin(cur.u,{model:cur.m})});
single('#an',c=>{V.animation=AN[c.dataset.a]()});
$('#rot').addEventListener('change',e=>{if(V)V.autoRotate=e.target.selected});
function dl(){const a=document.createElement('a');a.href=cur.u;a.download=cur.n.replace(/\.png$/i,'')+'.png';a.click()}
$('#dl').onclick=dl;$('#use').onclick=()=>{dl();window.open('https://ely.by','_blank');toast(t('usehint'))};
$('#fv').addEventListener('change',e=>{let f=favs().filter(x=>x!=cur.n);if(e.target.selected)f.push(cur.n);localStorage.fav=JSON.stringify(f);renderFav()});
/* ---- Gezinme ve hesap ---- */
const VS=['home','fav','me'];
function go(v){view=v;$('#q').value='';show_(v);$('#nb').activeIndex=VS.indexOf(v);scrollTo({top:0,behavior:'smooth'})}
$('#nb').addEventListener('navigation-bar-activated',e=>go(VS[e.detail.activeIndex]));
$('#acc').onclick=()=>go('me');
const user=()=>JSON.parse(localStorage.user||'null');
function renderMe(){const u=user();$('#out').hidden=!!u;$('#in').hidden=!u;if(u){$('#un').textContent=u.username;skin(u.username).then(x=>draw($('#av'),x)).catch(()=>{})}}
$('#login').onclick=async()=>{const n=($('#nick').value||'').trim();if(!n)return;try{await skin(n);localStorage.user=JSON.stringify({username:n});toast(t('hi')+n);renderMe()}catch(e){toast(e===404?t('nf'):t('fail'))}};
$('#nick').addEventListener('keydown',e=>e.key=='Enter'&&$('#login').click());
$('#lo').onclick=()=>{localStorage.removeItem('user');renderMe()};
$('#my').onclick=()=>show(user().username);
$('#upb').onclick=()=>$('#up').click();
$('#up').onchange=e=>{const f=e.target.files[0];if(f)show(f.name,URL.createObjectURL(f))};
$('#hues').replaceChildren(...[160,260,330,30,90,200].map(h=>{const d=document.createElement('button');d.className='dot'+(h==hue?' on':'');d.style.background=`oklch(.6 .17 ${h})`;d.setAttribute('aria-label','hue '+h);d.onclick=()=>{hue=h;localStorage.hue=h;theme();$$('.dot').forEach(x=>x.classList.toggle('on',x==d))};return d}));
$('#thm').onclick=()=>{dark=!dark;localStorage.dark=dark?1:0;theme()};
$('#lng').onclick=()=>$('#lm').open=!$('#lm').open;
theme();i18n();fillHome();renderMe();
/* Bileşenler ve font hazır olana kadar sayfayı gösterme (görsel hata önleme) */
Promise.race([Promise.all(['md-filled-button','md-dialog','md-navigation-bar','md-outlined-text-field'].map(n=>customElements.whenDefined(n))),new Promise(r=>setTimeout(r,6000))]).then(()=>document.documentElement.classList.add('rd'));
Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,4000))]).then(()=>document.documentElement.classList.add('fi'));
</script></body></html>
